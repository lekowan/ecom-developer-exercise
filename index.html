<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Carousel</title>
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
  </head>

  <body>
    <div
      class="carousel-wrapper"
      role="region"
      aria-label="Recommended products carousel"
    >
      <div id="carousel-loader" aria-live="polite">Loading products...</div>
      <div class="carousel-container" tabindex="0"></div>

      <button
        id="prev-btn"
        aria-label="Scroll carousel to previous products"
        aria-controls="carousel-container"
      ></button>

      <button
        id="next-btn"
        aria-label="Scroll carousel to next products"
        aria-controls="carousel-container"
      ></button>
    </div>

    <script src="./scripts/main.js"></script>
  </body>
</html>
